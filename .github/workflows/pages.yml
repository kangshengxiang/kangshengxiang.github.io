name: Build and deploy Jekyll
# Required: Settings > Pages > Source must be GitHub Actions.
# This installs the Gemfile theme; GitHub's automatic Pages builder does not.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Confirm bundled Jekyll and Minimal Mistakes
        run: |
          bundle check
          bundle exec ruby -e 'require "jekyll"; puts "Jekyll #{Jekyll::VERSION}"; puts "Minimal Mistakes #{Gem::Specification.find_by_name("minimal-mistakes-jekyll").version}"'
      - uses: actions/configure-pages@v5
      - name: Build production site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Validate generated pages
        run: bundle exec ruby scripts/validate.rb
      - name: Validate comment integration
        run: bundle exec ruby scripts/validate-waline.rb _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
